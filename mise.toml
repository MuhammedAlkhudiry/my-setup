[tasks.install]
description = "Generate outputs and install synced local config"
run = "bun run install:local"

[tasks.check]
description = "Run all project checks"
depends = ["format:check", "lint", "typecheck", "test"]

[tasks.format]
description = "Format TypeScript and project config files"
run = "bun run format"

[tasks."format:check"]
description = "Check formatting for TypeScript and project config files"
run = "bun run format:check"

[tasks.lint]
description = "Lint TypeScript files"
run = "bun run lint"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "bun run lint:fix"

[tasks.typecheck]
description = "Type-check TypeScript without emitting files"
run = "bun run typecheck"

[tasks.test]
description = "Run Bun tests"
run = "bun test"

[tasks.doctor]
description = "Check local required and optional tools"
run = "bun run doctor"

[tasks."tools:status"]
description = "Show installed external CLI tool versions"
run = "bun run tools:status"

[tasks."tools:update:plan"]
description = "Print safe update commands for external CLI tools"
run = "bun run tools:update:plan"

[tasks.watcher]
description = "Show the Mac watcher's alerts and memory, run it now, or resolve an alert"
run = "bun run watcher"

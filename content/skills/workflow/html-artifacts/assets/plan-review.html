<style type="text/tailwindcss">
  @layer components {
    .section-title { @apply flex items-center gap-2 text-lg font-semibold tracking-tight; }
    .seg { @apply inline-flex rounded-lg border border-line bg-subtle p-0.5; }
    .seg button { @apply rounded-md px-3 py-1 text-sm font-medium text-muted; }
    .seg button[aria-pressed="true"] { @apply bg-surface text-ink shadow-card; }
    .opt { @apply flex cursor-pointer items-start gap-2.5 rounded-lg border border-line px-3 py-2.5 text-sm hover:bg-subtle; }
    .opt:has(input:checked) { @apply border-accent bg-accent-soft; }
    .tick { @apply grid size-8 place-items-center rounded-lg border border-line text-sm text-muted hover:bg-subtle; }
    .tick[aria-pressed="true"].ok { @apply border-transparent bg-ok-soft text-ok; }
    .tick[aria-pressed="true"].bad { @apply border-transparent bg-bad-soft text-bad; }
    .editable { @apply rounded px-1 -mx-1 outline-none hover:bg-subtle focus:ring-2 focus:ring-accent/40; }
    .step { @apply flex gap-3 border-b border-line px-4 py-2.5 last:border-b-0; }
    .step.is-deleted .step-text { @apply line-through opacity-50; }
    .step.is-deleted { @apply bg-bad-soft/40; }
    .step.is-added { @apply bg-ok-soft/40; }
    .icon-btn { @apply grid size-7 place-items-center rounded-md text-sm text-muted hover:bg-subtle hover:text-ink; }
    .diff { @apply overflow-x-auto rounded-lg bg-subtle p-3 font-mono text-xs leading-relaxed; }
    .diff .add { @apply text-ok; }
    .diff .del { @apply text-bad; }
    .bar { @apply h-1.5 overflow-hidden rounded-full bg-subtle; }
    .bar > i { @apply block h-full rounded-full bg-ok transition-all; }
    .toggle { @apply relative inline-block h-5 w-9 rounded-full bg-line; }
    .toggle.on { @apply bg-accent; }
    .toggle::after { content: ""; @apply absolute top-0.5 left-0.5 size-4 rounded-full bg-white shadow transition-all; }
    .toggle.on::after { @apply left-4.5; }
    .toggle.locked { @apply opacity-60; }
  }
</style>
<style type="text/tailwindcss">
  @layer components {
    .editable { @apply rounded px-1 -mx-1 outline-none decoration-warn decoration-2 underline-offset-4 hover:bg-subtle focus:bg-accent-soft/50 focus:ring-2 focus:ring-accent/40; }
    .editable.is-edited { @apply underline decoration-dotted; }
    .editable:empty { @apply inline-block min-w-24; }
    .is-deleted .editable, .is-deleted .id { @apply line-through opacity-50; }
    .is-deleted { @apply bg-bad-soft/30; }
    .is-added { @apply bg-ok-soft/30; }
    .tools { @apply flex shrink-0 items-start gap-0.5 opacity-0 transition-opacity; }
    @media (hover: none) { .tools { @apply opacity-60; } }
    *:hover > .tools, .tools:focus-within, .tools.has-comment { @apply opacity-100; }
    .add { @apply rounded px-1 py-0.5 text-xs text-muted hover:text-accent; }
    .risk { @apply cursor-pointer select-none; }
  }
  [contenteditable]:empty::before { content: attr(data-ph); color: var(--color-muted); font-weight: 400; }
</style>
</head>

<!-- The AI writes only this JSON block. Everything below it is a fixed template. -->
<script id="plan" type="application/json">
{
  "id": "plan-notif-prefs-v1",
  "title": "Per-user notification preferences",
  "value": {
    "who": "Every signed-in user",
    "before": [
      "Unsubscribing from email also kills order updates",
      "Push is all or nothing, so users turn it off in iOS settings",
      "Support gets 'stop emailing me' tickets weekly"
    ],
    "after": [
      "Pick per type × channel in Settings",
      "One-click unsubscribe from a single email type",
      "Security alerts always arrive"
    ]
  },
  "approvals": [
    { "id": "D1", "kind": "Existing users", "title": "What existing users get on day one",
      "fact": "Whatever we backfill is what 40k users silently receive. If we pick opt-in, they stop getting emails and never know why — no undo.",
      "options": [
        { "key": "a", "label": "Everything on (no change from today)", "tradeoff": "Zero surprise; users opt out themselves", "rec": true },
        { "key": "b", "label": "Only in-app on; email and push opt-in", "tradeoff": "Cleaner inbox, but order emails stop for everyone" }
      ]},
    { "id": "D2", "kind": "Stored values", "title": "How notification types are stored",
      "fact": "These keys live in the DB and in signed unsubscribe links already sent. Renaming later = data migration + broken old links.",
      "options": [
        { "key": "a", "label": "Stable string keys: order.shipped, comment.reply", "tradeoff": "Survives code refactors", "rec": true },
        { "key": "b", "label": "PHP class names", "tradeoff": "No mapping, but breaks on any rename" }
      ]},
    { "id": "D3", "kind": "API contract", "title": "Preferences API shape",
      "fact": "The mobile app pins to this. Changing it after release needs a v2 endpoint until old app versions die out.",
      "options": [
        { "key": "a", "label": "Flat list [{ type, channel, enabled }]", "tradeoff": "Easy to add channels later", "rec": true },
        { "key": "b", "label": "Nested map { type: { email, push, inapp } }", "tradeoff": "Smaller payload, channels hard-coded" }
      ]}
  ],
  "assumptions": [
    { "id": "A1", "text": "Every notification extends one base class", "why": "If not, some notifications skip the preference check" },
    { "id": "A2", "text": "Mobile push is sent through Laravel notifications", "why": "If a separate service sends push, it needs its own gate" },
    { "id": "A3", "text": "Unsubscribe link disables that type on email only", "why": "Not all email, not push" }
  ],
  "visuals": [
    { "id": "G1", "title": "What the user sees", "kind": "html",
      "body": "<div class=\"mx-auto w-full max-w-[280px] rounded-[2rem] border-[6px] border-ink/80 bg-surface p-3 shadow-card\"><div class=\"mb-3 flex items-center gap-2 text-sm\"><span class=\"text-muted\">‹</span><span class=\"font-semibold\">Notifications</span></div><div class=\"grid grid-cols-[1fr_auto_auto_auto] items-center gap-x-3 gap-y-2.5 text-xs\"><span></span><span class=\"text-muted\">Email</span><span class=\"text-muted\">Push</span><span class=\"text-muted\">App</span><span>Order shipped</span><i class=\"toggle on\"></i><i class=\"toggle\"></i><i class=\"toggle on\"></i><span>Comment reply</span><i class=\"toggle\"></i><i class=\"toggle on\"></i><i class=\"toggle on\"></i><span>Weekly tips</span><i class=\"toggle\"></i><i class=\"toggle\"></i><i class=\"toggle\"></i><span class=\"flex items-center gap-1\">Login alert <span title=\"Always on\">🔒</span></span><i class=\"toggle on locked\"></i><i class=\"toggle on locked\"></i><i class=\"toggle on locked\"></i></div><div class=\"mt-4 rounded-lg bg-subtle p-2.5 text-[11px] text-muted\"><div class=\"mb-1 font-medium text-ink\">Email footer</div>Don't want these? <span class=\"text-accent underline\">Unsubscribe from order emails</span></div></div>" },
    { "id": "G2", "title": "How a notification is decided", "kind": "mermaid",
      "body": "flowchart LR\n  E[Event: order shipped] --> N[Notification]\n  N --> S{Security type?}\n  S -- yes --> ALL[Send on every channel]\n  S -- no --> P[(User preferences)]\n  P --> C1[Email ✓]\n  P --> C2[Push ✕]\n  P --> C3[In-app ✓]" },
    { "id": "G3", "title": "What changes in the code", "kind": "diff",
      "body": " app/\n   Notifications/\n+    BaseNotification.php      # checks preferences before sending\n   Enums/\n+    NotificationType.php      # stable keys, security flag\n   Http/Controllers/\n+    NotificationPreferenceController.php\n database/migrations/\n+  create_notification_preferences.php\n resources/js/pages/settings/\n+  notifications.tsx\n resources/views/mail/\n~  footer.blade.php            # + unsubscribe link" }
  ],
  "milestones": [
    { "id": "M1", "title": "Preferences are respected", "value": "Turning a channel off actually stops it",
      "steps": [
        { "id": "S1", "title": "Preferences table + stable type keys", "risk": "low" },
        { "id": "S2", "title": "Backfill existing users (per D1)", "risk": "med" },
        { "id": "S3", "title": "Gate every notification in the base class", "risk": "high" },
        { "id": "S4", "title": "Cache preferences in Redis", "risk": "med" }
      ]},
    { "id": "M2", "title": "Users can change them", "value": "Settings → Notifications screen",
      "steps": [
        { "id": "S5", "title": "GET / PUT preferences API (per D3)", "risk": "low" },
        { "id": "S6", "title": "Toggle grid with optimistic updates", "risk": "low" }
      ]},
    { "id": "M3", "title": "One-click unsubscribe", "value": "Fewer 'stop emailing me' tickets",
      "steps": [
        { "id": "S7", "title": "Signed unsubscribe link in email footer", "risk": "med" }
      ]}
  ]
}
</script>

<main class="page">
  <header class="page-header">
    <div class="min-w-0 flex-1 space-y-2">
      <div class="eyebrow">Plan review · <span class="normal-case">click any text to edit</span></div>
      <h1 id="title-slot"></h1>
    </div>
    <div class="flex items-end gap-4">
    <div class="w-48 space-y-1.5">
      <div class="flex justify-between text-xs"><span class="text-muted">Needs you</span><span id="progress-label" class="font-medium tabular-nums"></span></div>
      <div class="bar"><i id="progress-bar"></i></div>
    </div>
    <div data-feedback></div>
    </div>
  </header>

  <section class="card overflow-hidden">
    <div class="card-header"><span class="section-title">🎯 What users get</span><span id="who-slot" class="chip chip-accent"></span></div>
    <div class="grid md:grid-cols-[1fr_auto_1fr]">
      <div class="p-5"><div class="eyebrow mb-2">Today</div><div id="before" class="space-y-1"></div></div>
      <div class="hidden place-items-center px-2 text-2xl text-muted md:grid">→</div>
      <div class="border-t border-line bg-ok-soft/30 p-5 md:border-t-0 md:border-s"><div class="eyebrow mb-2">After this plan</div><div id="after" class="space-y-1"></div></div>
    </div>
  </section>

  <section class="space-y-3">
    <div class="flex flex-wrap items-baseline gap-2">
      <h2 class="section-title">🙋 Needs your approval</h2>
      <span class="text-xs text-muted">🔒 hard to reverse after release · click an option to decide</span>
    </div>
    <div id="approvals" class="grid gap-4 lg:grid-cols-3"></div>
    <div><button class="add" data-add="approvals">+ Decision</button></div>
    <div class="card">
      <div class="card-header"><h3>🧠 Is the AI right about these?</h3></div>
      <div id="assumptions"></div>
  </section>

  <section class="space-y-3">
    <h2 class="section-title">🗺️ How it works</h2>
    <div id="visuals" class="grid gap-4 lg:grid-cols-3"></div>
  </section>


  <details class="card" id="steps-wrap">
    <summary class="flex items-center gap-2 px-5 py-3 !text-base !text-ink"><span class="font-semibold">🧱 Implementation steps</span><span id="steps-count" class="chip"></span><span class="text-xs text-muted">low stakes, skim or skip</span></summary>
    <div id="milestones" class="grid gap-4 p-5 pt-0 lg:grid-cols-3"></div>
  </details>

  <section class="card">
    <div class="card-header"><h3>📝 Anything else</h3></div>
    <div class="card-body"><textarea id="general" class="field min-h-20" placeholder="Note on the whole plan…"></textarea></div>
  </section>
</main>


<script src="feedback.js"></script>
<script type="module">
import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

const RAW = JSON.parse(document.getElementById('plan').textContent);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const RISK = { low: 'chip-ok', med: 'chip-warn', high: 'chip-bad' };

// Give every editable thing a stable ID so edits can be described as a diff.
function normalize(p) {
  const wrap = (arr, prefix) => arr.map((text, i) => ({ id: prefix + (i + 1), text }));
  return {
    ...p,
    value: { who: p.value.who, before: wrap(p.value.before, 'T'), after: wrap(p.value.after, 'V') },
    approvals: p.approvals.map(d => ({ ...d, options: d.options.map(o => ({ ...o, id: `${d.id}.${o.key}` })) })),
  };
}
const ORIG = normalize(RAW);
let doc = structuredClone(ORIG);

const get = (o, path) => path ? path.split('.').reduce((a, k) => a?.[k], o) : o;
const set = (o, path, v) => { const ks = path.split('.'), last = ks.pop(); get(o, ks.join('.'))[last] = v; };
const parentPath = path => path.split('.').slice(0, -1).join('.');
const save = () => { Feedback.save({ planId: doc.id, doc }, feedback().text); refresh(); };
const live = list => list.filter(x => !x._deleted);
const nextId = prefix => prefix + (Math.max(0, ...[...JSON.stringify(doc).matchAll(new RegExp(`"id":"${prefix}(\\d+)"`, 'g'))].map(m => +m[1])) + 1);

// ---------- Building blocks ----------
function ed(path, cls = '', ph = 'Type…') {
  const orig = get(ORIG, path), cur = get(doc, path);
  const edited = orig !== undefined && cur !== orig;
  return `<span class="editable ${cls} ${edited ? 'is-edited' : ''}" contenteditable="plaintext-only" spellcheck="false" data-path="${path}" data-ph="${ph}">${esc(cur)}</span>`;
}
function tools(path, source = false) {
  const item = get(doc, path);
  return `<span class="tools ${item._comment ? 'has-comment' : ''}">${source ? `<button class="icon-btn" data-src="${path}" title="Edit source">✎</button>` : ''}
    <button class="icon-btn" data-comment="${path}" title="Comment">💬</button>
    <button class="icon-btn" data-del="${path}" title="${item._deleted ? 'Restore' : 'Remove'}">${item._deleted ? '↺' : '✕'}</button></span>`;
}
function commentBox(path) {
  const v = get(doc, path)._comment || '';
  return `<textarea class="field mt-2 min-h-14 ${v ? '' : 'hidden'}" data-path="${path}._comment" placeholder="Comment for the AI…">${esc(v)}</textarea>`;
}
const state = path => { const item = get(doc, path); return item._deleted ? 'is-deleted' : !findOrig(path) ? 'is-added' : ''; };
const findOrig = path => get(ORIG, path)?.id === get(doc, path).id ? get(ORIG, path) : null;
const changed = path => get(doc, path)?.changed && !get(doc, path)._deleted ? '<span class="chip chip-accent !py-0">updated</span>' : '';
const addBtn = (list, label) => `<button class="add mt-2" data-add="${list}">+ ${label}</button>`;

// ---------- Render ----------
function render() {
  $('#title-slot').innerHTML = ed('title');
  $('#who-slot').innerHTML = ed('value.who');

  for (const [key, mark] of [['before', '<span class="text-bad">✕</span>'], ['after', '<span class="text-ok">✓</span>']]) {
    $('#' + key).innerHTML = doc.value[key].map((t, i) => {
      const p = `value.${key}.${i}`;
      return `<div class="rounded-lg px-2 py-1 ${state(p)}"><div class="flex items-start gap-2 text-sm">${mark}<div class="flex-1">${ed(p + '.text')} ${changed(p)}</div>${tools(p)}</div>${commentBox(p)}</div>`;
    }).join('') + addBtn(`value.${key}`, key === 'before' ? 'Problem' : 'Value');
  }

  $('#approvals').innerHTML = doc.approvals.map((d, i) => {
    const p = `approvals.${i}`;
    return `<div class="card flex flex-col ${state(p)}" data-d="${p}">
      <div class="card-header"><span class="id">${d.id}</span>${changed(p)}<span class="chip chip-warn">🔒 ${ed(p + '.kind', '', 'Kind')}</span><span class="ms-auto"></span>${tools(p)}</div>
      <div class="card-body flex flex-1 flex-col gap-3">
        <h3>${ed(p + '.title', '', 'Decision…')}</h3>
        <div class="rounded-lg bg-warn-soft/50 px-3 py-2 text-sm">${ed(p + '.fact', '', 'Why this is hard to reverse…')}</div>
        <div class="space-y-1.5">${d.options.map((o, j) => {
          const op = `${p}.options.${j}`;
          return `<div class="opt ${state(op)}" data-opt="${op}"><input type="radio" name="${d.id}" value="${o.key}" class="mt-1 accent-[var(--color-accent)]" ${d._pick === o.key ? 'checked' : ''}>
            <div class="flex-1 space-y-0.5"><div class="font-medium">${ed(op + '.label', '', 'Option…')}${o.rec ? ' <span class="chip chip-accent ms-1">AI pick</span>' : ''}</div>
            <div class="text-xs text-muted">${ed(op + '.tradeoff', '', 'Trade-off…')}</div></div>${tools(op)}</div>${commentBox(op)}`;
        }).join('')}${addBtn(p + '.options', 'Option')}</div>
        ${commentBox(p)}
      </div></div>`;
  }).join('');

  $('#assumptions').innerHTML = doc.assumptions.map((a, i) => {
    const p = `assumptions.${i}`;
    return `<div class="border-b border-line px-5 py-3 ${state(p)}"><div class="flex items-start gap-3">
      <span class="id mt-1">${a.id}</span>
      <div class="flex-1 space-y-1"><div class="font-medium">${ed(p + '.text', '', 'Assumption…')} ${changed(p)}</div><div class="text-xs text-muted">${ed(p + '.why', '', 'If wrong…')}</div></div>
      <span class="tools !opacity-100">
        <button class="tick ok" data-check="${p}" data-val="ok" aria-pressed="${a._status === 'ok'}" title="Correct">✓</button>
        <button class="tick bad" data-check="${p}" data-val="wrong" aria-pressed="${a._status === 'wrong'}" title="Wrong">✕</button></span>${tools(p)}
    </div>${a._status === 'wrong' ? `<input class="field ms-9 mt-2 !w-[calc(100%-2.25rem)]" data-path="${p}._truth" placeholder="What's actually true?" value="${esc(a._truth)}">` : ''}${commentBox(p)}</div>`;
  }).join('') + `<div class="px-5 py-2">${addBtn('assumptions', 'Assumption')}</div>`;



  $('#milestones').innerHTML = doc.milestones.map((m, i) => {
    const p = `milestones.${i}`;
    return `<div class="rounded-card border border-line ${state(p)}">
      <div class="border-b border-line px-4 py-2.5"><div class="flex items-center gap-2"><span class="id">${m.id}</span><span class="flex-1 font-medium">${ed(p + '.title', '', 'Milestone…')} ${changed(p)}</span>${tools(p)}</div>
        <div class="mt-0.5 text-xs text-ok">↳ ${ed(p + '.value', '', 'User value…')}</div>${commentBox(p)}</div>
      ${m.steps.map((s, j) => {
        const sp = `${p}.steps.${j}`;
        return `<div class="step ${state(sp)}"><div class="min-w-0 flex-1"><div class="flex flex-wrap items-center gap-1.5">
          <span class="font-mono text-xs font-semibold text-accent">${s.id}</span><span class="text-sm">${ed(sp + '.title', '', 'Step…')}</span>
          ${changed(sp)}<button class="risk chip ${RISK[s.risk]} !py-0" data-risk="${sp}" title="Click to change risk">${s.risk}</button></div>${commentBox(sp)}</div>${tools(sp)}</div>`;
      }).join('')}
      <div class="px-4 py-1.5">${addBtn(p + '.steps', 'Step')}</div></div>`;
  }).join('') + `<div>${addBtn('milestones', 'Milestone')}</div>`;

  $('#general').value = doc._general || '';
  refresh();
}

async function renderVisuals() {
  $('#visuals').innerHTML = doc.visuals.map((v, i) => {
    const p = `visuals.${i}`, span = { mermaid: 'lg:col-span-2', diff: 'lg:col-span-3' }[v.kind] || '';
    return `<div class="card overflow-hidden ${span} ${state(p)}">
      <div class="card-header"><h3 class="flex-1">${ed(p + '.title', '', 'Title…')} ${changed(p)}</h3>
        ${tools(p, v.kind !== 'html')}</div>
      <div class="card-body space-y-3"><div data-visual="${i}"></div>
        ${v.kind !== 'html' ? `<textarea class="field hidden min-h-48 font-mono !text-xs" data-path="${p}.body" spellcheck="false">${esc(v.body)}</textarea>` : ''}
        ${commentBox(p)}</div></div>`;
  }).join('');
  for (const [i, v] of doc.visuals.entries()) await drawVisual(v, $(`[data-visual="${i}"]`), i);
}

async function drawVisual(v, el, i) {
  if (v.kind === 'mermaid') {
    try { el.innerHTML = (await mermaid.render('m' + i + Date.now(), v.body)).svg; el.className = 'grid place-items-center [&_svg]:!max-w-full'; }
    catch { el.innerHTML = '<div class="shot-empty !min-h-24">Diagram has a syntax error</div>'; }
  } else if (v.kind === 'diff') {
    el.innerHTML = `<pre class="diff">${v.body.split('\n').map(l => `<span class="${{ '+': 'add', '-': 'del', '~': 'text-warn' }[l[0]] || ''}">${esc(l)}</span>`).join('\n')}</pre>`;
  } else el.innerHTML = v.body;
}

// ---------- Interaction ----------
let drawTimer;
document.addEventListener('input', e => {
  const t = e.target, path = t.dataset.path;
  if (t.id === 'general') { doc._general = t.value; return save(); }
  if (!path) return;
  set(doc, path, t.isContentEditable ? t.textContent : t.value);
  if (t.isContentEditable) t.classList.toggle('is-edited', get(ORIG, path) !== undefined && get(ORIG, path) !== get(doc, path));
  if (/^visuals\.\d+\.body$/.test(path)) {
    clearTimeout(drawTimer);
    const i = +path.split('.')[1];
    drawTimer = setTimeout(() => drawVisual(doc.visuals[i], $(`[data-visual="${i}"]`), i), 400);
  }
  save();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.isContentEditable && !e.shiftKey) { e.preventDefault(); e.target.blur(); } });

const TEMPLATES = {
  'value.before': () => ({ id: nextId('T'), text: '' }),
  'value.after': () => ({ id: nextId('V'), text: '' }),
  approvals: () => { const id = nextId('D'); return { id, kind: '', title: '', fact: '', options: [{ id: id + '.a', key: 'a', label: '', tradeoff: '' }] }; },
  assumptions: () => ({ id: nextId('A'), text: '', why: '' }),
  milestones: () => ({ id: nextId('M'), title: '', value: '', steps: [] }),
};

document.addEventListener('click', async e => {
  const opt = e.target.closest('.opt');
  if (opt && !e.target.closest('[contenteditable], button')) {
    e.preventDefault();
    const d = get(doc, opt.closest('[data-d]').dataset.d), key = opt.querySelector('input').value;
    d._pick = d._pick === key ? undefined : key;
    save(); return render();
  }

  const b = e.target.closest('button');
  if (!b) return;
  const d = b.dataset;

  if (d.comment) {
    const box = document.querySelector(`[data-path="${d.comment}._comment"]`);
    box.classList.remove('hidden'); box.focus(); return;
  }
  if (d.src) { const ta = document.querySelector(`[data-path="${d.src}.body"]`); ta.classList.toggle('hidden'); if (!ta.classList.contains('hidden')) ta.focus(); return; }

  if (d.del) {
    const item = get(doc, d.del), isVisual = d.del.startsWith('visuals.');
    if (findOrig(d.del)) item._deleted = !item._deleted;
    else get(doc, parentPath(d.del)).splice(+d.del.split('.').pop(), 1);
    save(); return isVisual ? renderVisuals() : render();
  }
  if (d.check) { const a = get(doc, d.check); a._status = a._status === d.val ? null : d.val; save(); return render(); }
  if (d.risk) { const s = get(doc, d.risk), order = ['low', 'med', 'high']; s.risk = order[(order.indexOf(s.risk) + 1) % 3]; save(); return render(); }

  if (d.add) {
    let list, item;
    if (d.add.endsWith('.options')) {
      list = d.add; const dec = get(doc, parentPath(d.add)), key = String.fromCharCode(97 + dec.options.length);
      item = { id: `${dec.id}.${key}`, key, label: '', tradeoff: '' };
    } else if (d.add.endsWith('.steps')) { list = d.add; item = { id: nextId('S'), title: '', risk: 'low' }; }
    else { list = d.add; item = TEMPLATES[d.add](); }
    get(doc, list).push(item);
    save(); render();
    if (list.includes('milestones')) $('#steps-wrap').open = true;
    document.querySelector(`[data-path^="${list}.${get(doc, list).length - 1}."][contenteditable]`)?.focus();
  }
});

// ---------- Feedback for the AI ----------
const EDIT_SECTIONS = [
  { list: 'value.before', name: '🎯 Problems today', fields: ['text'] },
  { list: 'value.after', name: '🎯 User value', fields: ['text'] },
  { list: 'approvals', name: '🔒 Decisions', fields: ['kind', 'title', 'fact'], label: x => x.title, child: { list: 'options', fields: ['label', 'tradeoff'], label: x => x.label } },
  { list: 'assumptions', name: '🧠 Assumptions', fields: ['text', 'why'], label: x => x.text },
  { list: 'visuals', name: '🗺️ Visuals', fields: ['title', 'body'], label: x => x.title },
  { list: 'milestones', name: '🧱 Milestones and steps', fields: ['title', 'value'], label: x => x.title, child: { list: 'steps', fields: ['title', 'risk'], label: x => x.title } },
];

// Changed lines only, with one line of context, so long sources stay short in the feedback.
function lineDiff(a, b) {
  const A = a.split('\n'), B = b.split('\n');
  const L = Array.from({ length: A.length + 1 }, () => Array(B.length + 1).fill(0));
  for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const rows = [];
  let i = 0, j = 0;
  while (i < A.length || j < B.length) {
    if (i < A.length && j < B.length && A[i] === B[j]) { rows.push([' ', A[i]]); i++; j++; }
    else if (j < B.length && (i === A.length || L[i][j + 1] >= L[i + 1][j])) rows.push(['+', B[j++]]);
    else rows.push(['-', A[i++]]);
  }
  return rows.filter((r, k) => r[0] !== ' ' || [-1, 1].some(d => rows[k + d] && rows[k + d][0] !== ' ')).map(([m, l]) => m + l).join('\n');
}

function diffList(cfg, origList, curList, out, where = '') {
  const label = x => (cfg.label || (y => y.text))(x);
  const note = x => x._comment?.trim() ? ` — ${x._comment.trim()}` : '';
  const fmt = (f, v) => `"${v}"`;
  curList.forEach(item => {
    const o = origList?.find(x => x.id === item.id);
    if (item._deleted) return o && out.push(`- Remove ${item.id} "${label(o)}"${note(item)}`);
    if (!o) {
      const text = cfg.fields.map(f => item[f]).filter(v => v?.trim?.()).join(' — ');
      if (text || note(item)) out.push(`- Add ${item.id}${where}: ${text}${note(item)}`);
    } else {
      cfg.fields.forEach(f => {
        if ((item[f] ?? '') === (o[f] ?? '')) return;
        out.push(f === 'body' ? `- Edit ${item.id} "${label(item)}" source:\n\`\`\`diff\n${lineDiff(o[f], item[f])}\n\`\`\`` : `- Edit ${item.id} ${f}: ${fmt(f, o[f])} → ${fmt(f, item[f])}`);
      });
      if (note(item)) out.push(`- ${item.id} "${label(item)}"${note(item)}`);
    }
    if (cfg.child) diffList(cfg.child, o?.[cfg.child.list], item[cfg.child.list], out, ` in ${item.id}`);
  });
}

function feedback() {
  const L = [], sec = (title, rows) => rows.length && L.push('', `## ${title}`, ...rows);
  const edits = EDIT_SECTIONS.map(cfg => { const rows = []; diffList(cfg, get(ORIG, cfg.list), get(doc, cfg.list), rows); return [cfg.name, rows]; });
  const topEdits = ['title', 'value.who'].filter(p => get(doc, p) !== get(ORIG, p)).map(p => `- Edit ${p}: "${get(ORIG, p)}" → "${get(doc, p)}"`);
  const changed = topEdits.length || edits.some(([, r]) => r.length) || doc._general?.trim()
    || live(doc.approvals).some(d => !d.options.find(o => o.key === d._pick)?.rec) || live(doc.assumptions).some(a => a._status === 'wrong');
  const verdict = changed ? 'changes' : 'approve';

  L.push(`# Plan feedback: ${doc.id}`, '', `Verdict: ${{ approve: 'APPROVE', changes: 'APPROVE WITH CHANGES' }[verdict]}`);
  sec('🙋 Decision answers', live(doc.approvals).map(d => {
    const o = d.options.find(x => x.key === d._pick && !x._deleted);
    if (!o) return `- ${d.id} ${d.title}: NOT DECIDED, ask me again`;
    return `- ${d.id} ${d.title}: ${o.label}${o.rec ? ' (your pick)' : ' (CHANGED from your pick)'}`;
  }));
  const wrong = live(doc.assumptions).filter(a => a._status === 'wrong'), unchecked = live(doc.assumptions).filter(a => !a._status);
  sec('🧠 Assumption checks', [
    ...wrong.map(a => `- ${a.id} WRONG: "${a.text}"${a._truth?.trim() ? ` — actually: ${a._truth.trim()}` : ''}`),
    ...(unchecked.length ? [`- Not checked: ${unchecked.map(a => a.id).join(', ')} (verify in code before relying on them)`] : []),
  ]);
  const editRows = [...topEdits, ...edits.flatMap(([name, rows]) => rows.length ? [`### ${name}`, ...rows] : [])];
  sec('✏️ My edits to the plan', editRows);
  if (doc._general?.trim()) sec('📝 Overall', [doc._general.trim()]);
  L.push('', 'Everything not listed is approved as written. Update the plan and show me what changed.');
  return { text: L.join('\n'), verdict, edits: editRows.filter(r => r.startsWith('-')).length };
}

function refresh() {
  const ds = live(doc.approvals), as = live(doc.assumptions);
  const total = ds.length + as.length, done = ds.filter(d => d._pick).length + as.filter(a => a._status).length;
  $('#progress-label').textContent = `${done} / ${total}`;
  $('#progress-bar').style.width = `${total ? (done / total) * 100 : 100}%`;

  doc.approvals.forEach((d, i) => $(`[data-d="approvals.${i}"]`)?.classList.toggle('!border-ok', !!d._pick && !d._deleted));

  const steps = live(doc.milestones).flatMap(m => live(m.steps));
  $('#steps-count').textContent = `${steps.length} steps · ${live(doc.milestones).length} milestones`;
  const f = feedback();
  $('#progress-label').textContent += f.edits ? ` · ${f.edits} edit${f.edits > 1 ? 's' : ''}` : '';
}


const saved = await Feedback.init();
if (saved?.planId === ORIG.id) doc = saved.doc;

mermaid.initialize({ startOnLoad: false, theme: matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'neutral', fontFamily: 'Inter, system-ui' });
render();
await renderVisuals();
</script>

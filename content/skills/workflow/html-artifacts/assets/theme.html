<!-- Paste into <head>. Tailwind v4 runs in the browser; style with utilities plus the component classes below. -->
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style type="text/tailwindcss">
  @theme {
    --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "IBM Plex Sans Arabic", "Noto Sans Arabic", sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, monospace;

    --color-bg: #f7f7f8;
    --color-surface: #ffffff;
    --color-subtle: #f1f1f3;
    --color-line: #e4e4e7;
    --color-ink: #18181b;
    --color-muted: #71717a;
    --color-accent: #4f46e5;
    --color-accent-soft: #eef2ff;
    --color-ok: #15803d;
    --color-ok-soft: #dcfce7;
    --color-warn: #b45309;
    --color-warn-soft: #fef3c7;
    --color-bad: #b91c1c;
    --color-bad-soft: #fee2e2;

    --radius-card: 0.875rem;
    --shadow-card: 0 1px 2px rgb(0 0 0 / 0.04), 0 4px 16px -4px rgb(0 0 0 / 0.06);
  }

  @layer base {
    @media (prefers-color-scheme: dark) {
      :root {
        --color-bg: #0b0b0d;
        --color-surface: #16161a;
        --color-subtle: #1f1f24;
        --color-line: #2a2a31;
        --color-ink: #f4f4f5;
        --color-muted: #a1a1aa;
        --color-accent: #818cf8;
        --color-accent-soft: #1e1b4b;
        --color-ok: #4ade80;
        --color-ok-soft: #052e16;
        --color-warn: #fbbf24;
        --color-warn-soft: #3a2a05;
        --color-bad: #f87171;
        --color-bad-soft: #3b0d0d;
      }
    }

    html { @apply bg-bg text-ink font-sans antialiased; font-size: 15px; }
    h1 { @apply text-2xl font-semibold tracking-tight; }
    h2 { @apply text-lg font-semibold tracking-tight; }
    h3 { @apply text-base font-semibold; }
    a { @apply text-accent underline-offset-2 hover:underline; }
    code { @apply font-mono text-[0.85em] bg-subtle rounded px-1 py-0.5; }
    summary { @apply cursor-pointer text-sm text-muted select-none hover:text-ink; }
    details[open] > summary { @apply mb-2; }
  }

  @layer components {
    /* Layout */
    .page { @apply mx-auto max-w-7xl px-4 py-6 sm:px-8 sm:py-8 space-y-6; }
    .page-header { @apply flex flex-wrap items-end justify-between gap-3 border-b border-line pb-4; }
    .eyebrow { @apply text-xs font-medium uppercase tracking-wider text-muted; }
    .grid-cards { @apply grid gap-4 sm:grid-cols-2 xl:grid-cols-3; }

    /* Surfaces */
    .card { @apply bg-surface border border-line rounded-card shadow-card; }
    .card-header { @apply flex flex-wrap items-center gap-2 border-b border-line px-5 py-3; }
    .card-body { @apply p-5; }

    /* Chips: .chip plus one tone */
    .chip { @apply inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-medium whitespace-nowrap bg-subtle text-muted; }
    .chip-accent { @apply bg-accent-soft text-accent; }
    .chip-ok { @apply bg-ok-soft text-ok; }
    .chip-warn { @apply bg-warn-soft text-warn; }
    .chip-bad { @apply bg-bad-soft text-bad; }
    .id { @apply font-mono text-sm font-semibold text-accent; }

    /* Numbers */
    .stat { @apply bg-surface border border-line rounded-card shadow-card px-5 py-4; }
    .stat-value { @apply text-2xl font-semibold tabular-nums tracking-tight; }
    .stat-label { @apply text-xs text-muted; }

    /* Tables */
    .table { @apply w-full text-sm; }
    .table th { @apply text-start text-xs font-medium uppercase tracking-wider text-muted border-b border-line px-3 py-2; }
    .table td { @apply border-b border-line px-3 py-2.5 align-top; }
    .table tr:last-child td { @apply border-b-0; }
    .table tbody tr:hover { @apply bg-subtle; }

    /* Before / after and screenshots */
    .pair { @apply grid gap-4 md:grid-cols-2; }
    .pair-label { @apply mb-2 flex h-6 items-center gap-2 text-xs font-medium uppercase tracking-wider text-muted; }
    .shot { @apply block w-full rounded-lg border border-line bg-subtle shadow-card; }
    .shot-empty { @apply grid place-items-center rounded-lg border border-dashed border-line bg-subtle text-sm text-muted min-h-40; }
    /* Stand-in for untouched parts of a mockup screen; the current text color lets it fit any product surface. */
    .skel { @apply rounded-md bg-current/10; }

    /* Controls */
    .btn { @apply inline-flex items-center gap-1.5 rounded-lg border border-line bg-surface px-3 py-1.5 text-sm font-medium hover:bg-subtle; }
    .btn-primary { @apply border-transparent bg-accent text-surface hover:opacity-90; }
    .field { @apply w-full rounded-lg border border-line bg-surface px-3 py-2 text-sm focus:outline-2 focus:outline-accent; }
  }
</style>
